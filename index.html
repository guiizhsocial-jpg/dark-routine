<html lang="pt-BR"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="dark"]{--bg:#07070c;--s:rgba(255,255,255,.055);--bd:rgba(255,255,255,.09);--tx:#f2f2f7;--mut:#9a9ab0;--a:#8b5cf6;--b:#ec4899;--ok:#34d399;--g:linear-gradient(135deg,#8b5cf6,#ec4899);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Sora,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:96px;overflow-x:hidden}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.g1{background:#8b5cf6;top:-90px;left:-100px}.g2{background:#ec4899;bottom:60px;right:-120px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,70px) scale(1.2)}}
main{max-width:560px;margin:0 auto;padding:14px}
.c{background:var(--s);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.c:nth-child(2){animation-delay:.07s}.c:nth-child(3){animation-delay:.14s}.c:nth-child(4){animation-delay:.21s}.c:nth-child(5){animation-delay:.28s}.c:nth-child(n+6){animation-delay:.35s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
h1{font-size:26px;margin:0 0 8px;font-weight:800}h2{font-size:20px;margin:0 0 8px;font-weight:800}h3{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.m{color:var(--mut);font-size:12.5px;margin:4px 0}.big{font-size:30px;font-weight:800;margin:2px 0}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.b{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 10px}.b i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
button,.btn,select,input{font:inherit;color:var(--tx);background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;outline:none}
input:focus,select:focus{border-color:var(--a)}
button,.btn{cursor:pointer;transition:transform .15s,box-shadow .2s}button:active,.btn:active{transform:scale(.95)}
.pri{background:var(--g);border:0;font-weight:700;color:#fff;box-shadow:0 8px 24px -8px #8b5cf6}

.ch{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.chip.on{background:var(--g);border:0;font-weight:700}
.ring{position:relative;width:170px;margin:0 auto}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{border-top:1px solid var(--bd);padding:10px 0}.ex .in{display:flex;gap:6px;align-items:center}.ex input{margin:6px 0;width:70px;padding:9px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bd);margin-right:4px}.dot.on{background:var(--ok)}
a{cursor:pointer;color:var(--mut);margin-left:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:rgba(20,20,30,.82);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:26px;padding:6px;z-index:5}
nav button{background:none;border:0;border-radius:20px;padding:8px 10px;font-size:11px;color:var(--mut)}nav button.on{background:var(--g);color:#fff}
.ob{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 30px}
.ob>div{max-width:520px;margin:0 auto;animation:up .5s both}.pg{height:4px;background:var(--bd);border-radius:4px;margin-bottom:26px}.pg i{display:block;height:100%;background:var(--g);transition:width .5s}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--g);padding:10px 18px;border-radius:20px;font-weight:700;z-index:20;animation:tt 2.6s both}
@keyframes tt{0%{opacity:0;top:-20px}12%,85%{opacity:1}100%{opacity:0}}
.fire{display:inline-block;animation:pu 1.4s infinite}@keyframes pu{50%{transform:scale(1.25)}}
.gl{height:90px;width:54px;border:2px solid var(--bd);border-radius:6px 6px 18px 18px;overflow:hidden;position:relative}.gl i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#60a5fa,#3b82f6);transition:height 1s}
.warn{border-color:#f59e0b;color:#fbbf24}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hd b{font-size:19px}.hd button{border-radius:50%;width:44px;height:44px;padding:0;background:var(--g);border:0}
.xp{height:5px;background:var(--bd);border-radius:5px;margin-top:6px;width:150px}.xp i{display:block;height:100%;background:var(--g);border-radius:5px}
.seg{display:flex;gap:8px;margin-bottom:6px}.seg .chip{flex:1;font-size:13px;padding:12px 6px}
.go{display:block;margin:20px auto;width:150px;height:150px;border-radius:50%;font-size:22px;font-weight:800;letter-spacing:.06em;animation:pg 2s infinite}
@keyframes pg{0%{box-shadow:0 0 0 0 rgba(236,72,153,.5)}100%{box-shadow:0 0 0 34px rgba(236,72,153,0)}}
.live{text-align:center}.live .big{font-size:68px;line-height:1.05}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.stat b{display:block;font-size:21px}
.mp{display:block;width:100%;height:180px;background:rgba(255,255,255,.03);border-radius:16px}
.mo{position:fixed;inset:0;z-index:30;background:rgba(5,5,10,.94);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;text-align:center}.mo img{width:min(72vw,290px);border-radius:18px;box-shadow:0 20px 60px -10px #8b5cf6}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd div{text-align:center;padding:10px 4px;border-radius:14px;background:var(--s);font-size:11px;opacity:.35}.bd div.on{opacity:1;background:var(--g)}.bd span{font-size:24px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--mut);font-size:11px}
.dy{padding:0;height:42px;border-radius:12px;position:relative;font-size:13px}.dy i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:11px}
.dy.pd{background:#ec4899;color:#fff;border:0}.dy.pp{border:1px dashed #ec4899}.dy.fw{background:rgba(139,92,246,.28)}.dy.ov{background:#8b5cf6;color:#fff;border:0}.dy.tdy{outline:2px solid var(--tx)}.dy.sel{box-shadow:0 0 0 2px var(--a)}
.cyc{background:linear-gradient(135deg,rgba(236,72,153,.28),rgba(139,92,246,.22))}
.fh{position:fixed;bottom:90px;z-index:40;pointer-events:none;animation:fy 2s ease-out forwards}@keyframes fy{to{transform:translateY(-60vh) rotate(20deg);opacity:0}}
.rt{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:15;background:var(--g);padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
.ic{display:inline-block;vertical-align:-3px;flex:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px}
.seg .chip{display:flex;flex-direction:column;align-items:center;gap:6px}
.bd .ic{display:block;margin:0 auto 5px}
.fire{color:#f97316}.fh{color:#ec4899}
.dy i.hrt{color:#ec4899;line-height:0;bottom:4px}.dy.pd i.hrt,.dy.ov i.hrt{color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

"3"/><path d="M8 9a5 5 0 018 0M12 9l2-2"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>'};

let S={p:{},food:[],wk:[],wt:[],lg:[],ses:[],wa:{},cy:{st:[],en:{},hr:{},lg:{}},ms:[],fa:null};
try{const x=localStorage.getItem('dr1');if(x)S=Object.assign(S,JSON.parse(x))}catch(_){}

const ld=d=>{d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ago=n=>ld(new Date(Date.now()-n*864e5)),p=()=>S.p;let td=ld();
const AF=[1.2,1.375,1.55,1.725],RK=[.25,.5,.75];

const PL={3:['Full A','Full B','Full A'],4:['Superior','Inferior','Superior','Inferior'],5:['Push','Pull','Inferior','Superior','Inferior'],6:['Push','Pull','Inferior','Push','Pull','Inferior']};

const plan=()=>PL[p().dias],nextT=()=>plan()[S.ses.length%plan().length],exs=t=>EX[t].map(x=>x[p().loc]),scheme=()=>p().exp?'4×8–12':'3×10–12';

let G={on:0,ty:'run',pts:[],d:0,el:0,pa:0,spl:[],sg:'',er:''};
function gStart(){if(!navigator.geolocation){G.er='Este navegador não oferece GPS.';return render(1)}
