<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark Routine</title>
<meta name="theme-color" content="#07070c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dark Routine"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="dark"]{--bg:#07070c;--s:rgba(255,255,255,.055);--bd:rgba(255,255,255,.09);--tx:#f2f2f7;--mut:#9a9ab0;--a:#8b5cf6;--b:#ec4899;--ok:#34d399;--g:linear-gradient(135deg,#8b5cf6,#ec4899);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Sora,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:96px;overflow-x:hidden}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.g1{background:#8b5cf6;top:-90px;left:-100px}.g2{background:#ec4899;bottom:60px;right:-120px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,70px) scale(1.2)}}
main{max-width:560px;margin:0 auto;padding:14px}
.c{background:var(--s);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.c:nth-child(2){animation-delay:.07s}.c:nth-child(3){animation-delay:.14s}.c:nth-child(4){animation-delay:.21s}.c:nth-child(5){animation-delay:.28s}.c:nth-child(n+6){animation-delay:.35s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
h1{font-size:26px;margin:0 0 8px;font-weight:800}h2{font-size:20px;margin:0 0 8px;font-weight:800}h3{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.m{color:var(--mut);font-size:12.5px;margin:4px 0}.big{font-size:30px;font-weight:800;margin:2px 0}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.b{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 10px}.b i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
button,.btn,select,input{font:inherit;color:var(--tx);background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;outline:none}
input:focus,select:focus{border-color:var(--a)}
button,.btn{cursor:pointer;transition:transform .15s,box-shadow .2s}button:active,.btn:active{transform:scale(.95)}
.pri{background:var(--g);border:0;font-weight:700;color:#fff;box-shadow:0 8px 24px -8px #8b5cf6}
input{width:100%;box-sizing:border-box;margin:4px 0 10px}label{font-size:12px;color:var(--mut)}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.chip.on{background:var(--g);border:0;font-weight:700}
.ring{position:relative;width:170px;margin:0 auto}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{border-top:1px solid var(--bd);padding:10px 0}.ex .in{display:flex;gap:6px;align-items:center}.ex input{margin:6px 0;width:70px;padding:9px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bd);margin-right:4px}.dot.on{background:var(--ok)}
a{cursor:pointer;color:var(--mut);margin-left:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:rgba(20,20,30,.82);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:26px;padding:6px;z-index:5}
nav button{background:none;border:0;border-radius:20px;padding:8px 10px;font-size:11px;color:var(--mut)}nav button.on{background:var(--g);color:#fff}
.ob{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 30px}
.ob>div{max-width:520px;margin:0 auto;animation:up .5s both}.pg{height:4px;background:var(--bd);border-radius:4px;margin-bottom:26px}.pg i{display:block;height:100%;background:var(--g);transition:width .5s}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--g);padding:10px 18px;border-radius:20px;font-weight:700;z-index:20;animation:tt 2.6s both}
@keyframes tt{0%{opacity:0;top:-20px}12%,85%{opacity:1}100%{opacity:0}}
.fire{display:inline-block;animation:pu 1.4s infinite}@keyframes pu{50%{transform:scale(1.25)}}
.gl{height:90px;width:54px;border:2px solid var(--bd);border-radius:6px 6px 18px 18px;overflow:hidden;position:relative}.gl i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#60a5fa,#3b82f6);transition:height 1s}
.warn{border-color:#f59e0b;color:#fbbf24}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hd b{font-size:19px}.hd button{border-radius:50%;width:44px;height:44px;padding:0;background:var(--g);border:0}
.xp{height:5px;background:var(--bd);border-radius:5px;margin-top:6px;width:150px}.xp i{display:block;height:100%;background:var(--g);border-radius:5px}
.seg{display:flex;gap:8px;margin-bottom:6px}.seg .chip{flex:1;font-size:13px;padding:12px 6px}
.go{display:block;margin:20px auto;width:150px;height:150px;border-radius:50%;font-size:22px;font-weight:800;letter-spacing:.06em;animation:pg 2s infinite}
@keyframes pg{0%{box-shadow:0 0 0 0 rgba(236,72,153,.5)}100%{box-shadow:0 0 0 34px rgba(236,72,153,0)}}
.live{text-align:center}.live .big{font-size:68px;line-height:1.05}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.stat b{display:block;font-size:21px}
.mp{display:block;width:100%;height:180px;background:rgba(255,255,255,.03);border-radius:16px}
.mo{position:fixed;inset:0;z-index:30;background:rgba(5,5,10,.94);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;text-align:center}.mo img{width:min(72vw,290px);border-radius:18px;box-shadow:0 20px 60px -10px #8b5cf6}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd div{text-align:center;padding:10px 4px;border-radius:14px;background:var(--s);font-size:11px;opacity:.35}.bd div.on{opacity:1;background:var(--g)}.bd span{font-size:24px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--mut);font-size:11px}
.dy{padding:0;height:42px;border-radius:12px;position:relative;font-size:13px}.dy i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:11px}
.dy.pd{background:#ec4899;color:#fff;border:0}.dy.pp{border:1px dashed #ec4899}.dy.fw{background:rgba(139,92,246,.28)}.dy.ov{background:#8b5cf6;color:#fff;border:0}.dy.tdy{outline:2px solid var(--tx)}.dy.sel{box-shadow:0 0 0 2px var(--a)}
.cyc{background:linear-gradient(135deg,rgba(236,72,153,.28),rgba(139,92,246,.22))}
.fh{position:fixed;bottom:90px;z-index:40;pointer-events:none;animation:fy 2s ease-out forwards}@keyframes fy{to{transform:translateY(-60vh) rotate(20deg);opacity:0}}
.rt{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:15;background:var(--g);padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
.ic{display:inline-block;vertical-align:-3px;flex:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px}
nav{width:calc(100% - 24px);max-width:560px;box-sizing:border-box;justify-content:space-around}
nav button{flex:1;min-width:0;padding:8px 3px;font-size:10px}
.seg .chip{display:flex;flex-direction:column;align-items:center;gap:6px}
.bd .ic{display:block;margin:0 auto 5px}
.fire{color:#f97316}.fh{color:#ec4899}
.dy i.hrt{color:#ec4899;line-height:0;bottom:4px}.dy.pd i.hrt,.dy.ov i.hrt{color:#fff}
.q{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.q button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.pi{width:72px!important;margin:0!important;padding:8px!important}.stat span.m{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Minha Rotina */
.routine-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.routine-date{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.routine-date button{padding:8px 12px}
.routine-task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--bd)}
.routine-task:last-child{border-bottom:0}
.routine-check{width:34px;height:34px;min-width:34px;padding:0;border-radius:12px;display:grid;place-items:center}
.routine-check.done{background:var(--g);border-color:transparent;color:#fff}
.routine-task.completed .routine-name{text-decoration:line-through;color:var(--mut)}
.routine-time{font-size:12px;color:var(--mut);min-width:48px;font-variant-numeric:tabular-nums}
.routine-meta{font-size:11px;color:var(--mut)}
.routine-delete{padding:7px 9px;font-size:12px;color:var(--mut)}
.routine-form{display:grid;grid-template-columns:1fr 104px;gap:8px}
.routine-form input,.routine-form select{min-width:0;margin:3px 0 8px}
.routine-form .wide{grid-column:1/-1}
.routine-empty{text-align:center;padding:24px 10px;color:var(--mut)}
@media(max-width:360px){.routine-form{grid-template-columns:1fr}.routine-form .wide{grid-column:auto}}


.social-avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--g);font-size:30px;flex:none;overflow:hidden}.social-avatar img{width:100%;height:100%;object-fit:cover}.social-photo-preview{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid #c45bdf}.social-profile-grid button{overflow:hidden}.social-profile-grid button img{width:100%;height:100%;object-fit:cover}
.social-card{border:1px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0;background:rgba(255,255,255,.025)}
.social-row{display:flex;align-items:center;gap:10px}
/* Abas da comunidade: grade responsiva, sem sobreposição no celular */
.social-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0;overflow:visible;width:100%}
.social-tabs button{white-space:normal;overflow-wrap:anywhere;word-break:normal;min-width:0;width:100%;min-height:44px;padding:10px 5px;font-size:clamp(11px,3.2vw,13px);line-height:1.2;text-align:center;display:flex;align-items:center;justify-content:center;border-radius:14px}
@media(max-width:350px){.social-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.social-tabs button{font-size:12px}}
.social-profile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.social-profile-grid button{min-height:64px;font-size:27px;border-radius:18px;padding:8px;display:grid;place-items:center}
.social-profile-grid button.on{outline:2px solid #c45bdf;background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.social-form label{display:block;margin:14px 0 6px;font-size:14px;color:var(--mut)}
.social-form input,.social-form textarea,.social-form select{width:100%;min-width:0;box-sizing:border-box}
.social-form .social-row{align-items:stretch;flex-wrap:wrap}
.social-profile-head{display:flex;align-items:center;gap:14px;padding:8px 0 14px}
.social-profile-head .social-avatar{width:76px;height:76px;font-size:40px}
.social-subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.social-subtabs button{font-size:14px;padding:10px 5px}
.social-rank{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--bd)}
.social-rank:last-child{border-bottom:0}
.social-rank .social-avatar{width:42px;height:42px;font-size:23px}
.social-bottomspace{height:130px}.social-form .photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.social-form input[type=file]{padding:10px;border-radius:12px}
@media(max-width:420px){.social-profile-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.social-subtabs button{font-size:12px;padding:8px 3px}}

/* Dark Routine Social v2 */
.drs-comments{padding:10px 13px;border-top:1px solid var(--bd)}.drs-comments p{font-size:11px;margin:7px 0}.drs-comments small{color:var(--mut);font-size:9px}.drs-comment-form{display:flex;gap:6px}.drs-comment-form input{flex:1;min-width:0;margin:0}.drs-comment-form button{font-size:10px;padding:7px 10px}
.drs-app{max-width:560px;margin:0 auto;padding-bottom:18px}
.drs-header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
.drs-header h2{font-size:28px;margin:0}.drs-header>button{width:44px;height:44px;border:0;border-radius:16px;background:var(--g);color:#fff;font-size:21px}
.drs-eyebrow{font-size:9px;letter-spacing:.2em;font-weight:800;color:#c084fc}
.drs-nav{display:flex;flex-wrap:nowrap;gap:5px;padding:7px;margin:0 0 16px;border:1px solid var(--bd);border-radius:20px;background:rgba(20,18,32,.92);backdrop-filter:blur(16px);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;max-width:100%;-webkit-overflow-scrolling:touch}
.drs-nav::-webkit-scrollbar{display:none}
.drs-nav button{display:flex;flex:0 0 76px;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 3px;border:0;background:none;color:var(--mut);font-size:20px;border-radius:13px}
.drs-nav button span{font-size:10px;white-space:nowrap}.drs-nav button.active{color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.32),rgba(236,72,153,.2));border-radius:13px}
.drs-app{width:100%;max-width:560px;min-width:0;margin:0 auto;padding:0 0 12px;box-sizing:border-box}
.drs-app *{box-sizing:border-box}
.drs-feed,.drs-discover,.drs-friends,.drs-profile{min-width:0;width:100%}
.social-bottomspace{height:calc(112px + env(safe-area-inset-bottom,0px))}
@media(max-width:380px){.drs-nav button{flex-basis:70px}}
.drs-feed-hero,.drs-discover-hero{padding:20px;border:1px solid var(--bd);border-radius:23px;background:radial-gradient(circle at 90% 5%,rgba(236,72,153,.25),transparent 38%),linear-gradient(135deg,rgba(139,92,246,.2),rgba(255,255,255,.025));margin-bottom:13px}
.drs-feed-hero{display:flex;align-items:center;justify-content:space-between}.drs-feed-hero h1,.drs-discover-hero h1{font-size:27px;line-height:1.15;margin:7px 0}
.drs-add{width:48px;height:48px;border:0;border-radius:16px;background:var(--g);color:white;font-size:28px}
.drs-feed-tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.drs-feed-tabs button{white-space:nowrap;font-size:11px;border-radius:24px;padding:9px 14px}.drs-feed-tabs button.active{background:var(--g);border:0;color:white}
.drs-composer{width:100%;display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:14px;border-radius:18px;padding:12px;background:rgba(255,255,255,.04)}
.drs-composer span:nth-child(2){flex:1;color:var(--mut);font-size:11px}.drs-mini-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--g)}
.drs-composer b{font-size:20px;color:#d8b4fe}
.drs-post{overflow:hidden;margin-bottom:15px;border:1px solid var(--bd);border-radius:21px;background:rgba(255,255,255,.035)}
.drs-post-head{display:flex;align-items:center;gap:9px;padding:12px}.drs-post-head .social-avatar{width:42px;height:42px;font-size:22px}
.drs-post-user{flex:1;min-width:0}.drs-post-user b,.drs-post-user small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drs-post-user small{font-size:9px;color:var(--mut)}
.drs-follow{font-size:10px;padding:7px 10px;border-radius:20px;color:#d8b4fe}
.drs-post-copy{padding:0 13px 12px;margin:0;font-size:13px;white-space:pre-wrap}
.drs-post-media{background:#08070c}.drs-post-media img{display:block;width:100%;max-height:560px;object-fit:cover}
.drs-activity{display:grid;grid-template-columns:repeat(3,1fr);padding:12px;background:linear-gradient(110deg,rgba(139,92,246,.15),rgba(236,72,153,.10))}
.drs-activity div{text-align:center;border-right:1px solid var(--bd)}.drs-activity div:last-child{border:0}.drs-activity b,.drs-activity small{display:block}.drs-activity b{font-size:15px}.drs-activity small{font-size:9px;color:var(--mut)}
.drs-post-actions{display:flex;gap:8px;padding:8px 10px}.drs-post-actions button{border:0;background:none;font-size:11px;color:var(--mut);padding:7px}.drs-post-actions button.liked{color:#f472b6}
.drs-empty{padding:30px 16px;text-align:center;border:1px dashed var(--bd);border-radius:22px}.drs-empty>div{font-size:28px;color:#c084fc}
.drs-search{display:flex;gap:6px;margin-top:15px;padding:5px;background:rgba(0,0,0,.22);border:1px solid var(--bd);border-radius:15px}.drs-search input{flex:1;min-width:0;margin:0;border:0;background:transparent}.drs-search button{background:var(--g);border:0;font-size:11px}
.drs-section-title{display:flex;align-items:center;justify-content:space-between;margin:19px 2px 10px}.drs-section-title h2{font-size:16px;margin:0}
.drs-people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.drs-person{overflow:hidden;border:1px solid var(--bd);border-radius:19px;background:rgba(255,255,255,.035);text-align:center}
.drs-person-banner{height:52px;background:radial-gradient(circle at 80% 15%,rgba(236,72,153,.6),transparent 35%),linear-gradient(120deg,#30204d,#29172e)}
.drs-person-content{padding:0 10px 12px}.drs-person-content .social-avatar{width:56px;height:56px;margin:-27px auto 7px;border:3px solid #171320}
.drs-person-content>b,.drs-person-content>small{display:block}.drs-person-content>b{font-size:12px}.drs-person-content>small{font-size:9px;color:var(--mut)}
.drs-person-content p{height:30px;overflow:hidden;font-size:10px;color:var(--mut)}.drs-person-content em{display:block;font-size:9px;color:#d8b4fe;font-style:normal;margin:5px}
.drs-person-content button{width:100%;margin-top:5px;padding:8px 4px;font-size:10px}
.drs-person-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.drs-person-row .social-avatar{width:40px;height:40px;font-size:21px}.drs-person-row>div:nth-child(2){flex:1;min-width:0}.drs-person-row b,.drs-person-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drs-person-row small{font-size:9px;color:var(--mut)}.drs-person-row button{font-size:9px;padding:7px}
.drs-profile{overflow:hidden;border:1px solid var(--bd);border-radius:23px;background:rgba(255,255,255,.025)}
.drs-cover{height:130px;display:flex;align-items:end;padding:12px;background:radial-gradient(circle at 80% 15%,rgba(236,72,153,.7),transparent 30%),radial-gradient(circle at 15% 90%,rgba(139,92,246,.7),transparent 42%),linear-gradient(120deg,#171025,#2b1a38)}
.drs-cover span{font-size:9px;letter-spacing:.2em;color:#eadcff}
.drs-profile-body{padding:0 14px 14px}.drs-profile-head{display:flex;align-items:center;gap:10px;margin-top:-29px;position:relative}
.drs-profile-head .social-avatar{width:70px;height:70px;border:4px solid #171320;font-size:34px}.drs-profile-head>div:nth-child(2){flex:1;min-width:0;padding-top:26px}.drs-profile-head h2{font-size:16px;margin:0}.drs-profile-head small{font-size:10px;color:var(--mut)}.drs-profile-head button{margin-top:24px;font-size:9px;padding:7px 9px}
.drs-bio{font-size:11px;color:#d5d0e0;margin:12px 0}.drs-stats{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.drs-stats div{text-align:center;border-right:1px solid var(--bd)}.drs-stats div:last-child{border:0}.drs-stats b,.drs-stats small{display:block}.drs-stats b{font-size:16px}.drs-stats small{font-size:9px;color:var(--mut)}
.drs-profile-label{padding:13px;text-align:center;font-size:9px;letter-spacing:.18em;color:var(--mut)}

async function drFoodModel(status){
 if(DR_FOOD_PIPE)return DR_FOOD_PIPE;
 if(!DR_FOOD_LOADING){
  DR_FOOD_LOADING=(async()=>{
   if(status)status.textContent='Preparando o reconhecedor local… na primeira utilização, o modelo precisa ser baixado (aprox. 155 MB).';
   const lib=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');
   if(lib.env){lib.env.allowRemoteModels=true;lib.env.allowLocalModels=false;lib.env.useBrowserCache=true;}
   return await lib.pipeline('zero-shot-image-classification',DR_FOOD_MODEL,{dtype:'q8',progress_callback:(v)=>{if(status&&v&&v.status==='progress'&&Number.isFinite(v.progress))status.textContent='Baixando modelo local: '+Math.round(v.progress)+'%';}});
  })().then(m=>(DR_FOOD_PIPE=m,m)).catch(err=>{DR_FOOD_LOADING=null;throw err;});
 }
 return DR_FOOD_LOADING;
}
async function drFoodCropBlobs(blob){
 const bmp=await createImageBitmap(blob),w=bmp.width,h=bmp.height;
 const specs=[['foto inteira',0,0,1,1],['lado esquerdo',0,0,.68,1],['lado direito',.32,0,.68,1],['parte superior',0,0,1,.68],['parte inferior',0,.32,1,.68]];
 const out=[];
 try{
  for(const [name,x,y,cw,ch] of specs){const sx=Math.round(w*x),sy=Math.round(h*y),sw=Math.max(1,Math.round(w*cw)),sh=Math.max(1,Math.round(h*ch)),scale=Math.min(1,640/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*scale));c.height=Math.max(1,Math.round(sh*scale));const ctx=c.getContext('2d');if(!ctx)continue;ctx.drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);const b=await new Promise((resolve,reject)=>c.toBlob(v=>v?resolve(v):reject(new Error('Falha ao preparar um recorte da foto.')),'image/jpeg',.88));out.push({name,blob:b});}
 }finally{if(bmp.close)bmp.close();}
 return out;
}

async function foto(f){

 try{
  if(!/^image\//.test(f.type||''))throw new Error('Selecione um arquivo de imagem.');
  if(f.size>15*1024*1024)throw new Error('A foto precisa ter até 15 MB.');
  s.textContent='Preparando a foto no seu aparelho…';const bl=await shrink(f);
  if(DR_FOOD_PHOTO_URL)URL.revokeObjectURL(DR_FOOD_PHOTO_URL);DR_FOOD_PHOTO_URL=URL.createObjectURL(bl);PIC=DR_FOOD_PHOTO_URL;
  pend=[];const pd=$('#pd');if(pd)pd.innerHTML='';DR_FOOD_RESULTS=[];drFoodRender();
  const model=await drFoodModel(s),lib=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');
  if(!lib.RawImage||typeof lib.RawImage.fromBlob!=='function')throw new Error('O conversor de imagens não carregou. Atualize a página e tente novamente.');
  const crops=await drFoodCropBlobs(bl),aggregate=new Map();
  for(let ci=0;ci<crops.length;ci++){
   s.textContent='Analisando '+crops[ci].name+' ('+(ci+1)+'/'+crops.length+') no próprio aparelho…';
   const image=await lib.RawImage.fromBlob(crops[ci].blob);if(!image||!image.data||!image.width||!image.height)continue;
   const out=await model(image,DR_FOOD_LABELS);
   for(const item of (Array.isArray(out)?out.slice(0,6):[])){const key=item.label,old=aggregate.get(key)||{label:key,score:0,hits:0};old.score=Math.max(old.score,+item.score||0);old.hits++;aggregate.set(key,old);}
  }
  DR_FOOD_RESULTS=[...aggregate.values()].filter(x=>x.score>=.055).sort((a,b)=>(b.score+(b.hits-1)*.012)-(a.score+(a.hits-1)*.012)).slice(0,8);
  drFoodRender();s.textContent=DR_FOOD_RESULTS.length?'Análise local concluída. Selecione todos os alimentos que realmente aparecem e ajuste as porções.':'Não consegui sugerir alimentos com segurança. Use a busca manual abaixo.';
 }catch(err){console.error('Dark Routine food classifier:',err);s.textContent=err&&err.message?err.message:'Não foi possível analisar a foto. Verifique a internet no primeiro download e tente novamente.';}
}

// Minha Rotina: tarefas recorrentes e conclusão diária, salvas neste aparelho.
let routineDate=ld();
function routineDayKey(d){return new Date(d+'T12:00:00').getDay()}
function routineShift(delta){const d=new Date(routineDate+'T12:00:00');d.setDate(d.getDate()+delta);routineDate=ld(d);render(1)}
function routineTasksForDay(){
 const dow=routineDayKey(routineDate);
 return (S.routine.tasks||[]).filter(t=>t.createdOn<=routineDate&&(t.repeat==='once'?t.createdOn===routineDate:t.repeat==='weekdays'?[1,2,3,4,5].includes(dow):t.repeat==='weekend'?[0,6].includes(dow):true)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}
function routineToggle(id){const key=routineDate;S.routine.done[key]=S.routine.done[key]||{};S.routine.done[key][id]=!S.routine.done[key][id];save();render(1)}
function routineAdd(){
 const title=($('#routineTitle')?.value||'').trim(),time=$('#routineTime')?.value||'09:00',category=$('#routineCategory')?.value||'Pessoal',repeat=$('#routineRepeat')?.value||'daily';
 if(!title)return toast('Escreva o que você precisa fazer.');
 const id='rt_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
 S.routine.tasks.push({id,title,time,category,repeat,createdOn:routineDate});save();render(1);toast('Atividade adicionada!');
}
function routineDelete(id){if(!confirm('Excluir esta atividade da sua rotina?'))return;S.routine.tasks=S.routine.tasks.filter(t=>t.id!==id);Object.values(S.routine.done||{}).forEach(d=>{if(d)delete d[id]});save();render(1)}
function routineView(){
 const tasks=routineTasksForDay(),done=S.routine.done[routineDate]||{},completed=tasks.filter(t=>done[t.id]).length,pct=tasks.length?Math.round(completed/tasks.length*100):0;
 const today=routineDate===ld(),dateLabel=new Date(routineDate+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
 const repeatLabel={daily:'Todos os dias',weekdays:'Dias úteis',weekend:'Fim de semana',once:'Só neste dia'};
 return `<div class="c"><div class="routine-head"><div><h2>Minha <span class="grad">Rotina</span></h2><p class="m">Seu dia organizado, no seu ritmo.</p></div>${ic('clock',30)}</div>
 <div class="routine-date"><button onclick="routineShift(-1)" aria-label="Dia anterior">‹</button><div style="text-align:center;min-width:0"><b style="text-transform:capitalize">${e(dateLabel)}</b>${today?'<div class="m">Hoje</div>':''}</div><button onclick="routineShift(1)" aria-label="Próximo dia">›</button></div>
 <div class="r"><b>Progresso do dia</b><b>${completed}/${tasks.length} · ${pct}%</b></div><div class="b"><i style="width:${pct}%"></i></div>
 ${tasks.length?tasks.map(t=>`<div class="routine-task ${done[t.id]?'completed':''}"><button class="routine-check ${done[t.id]?'done':''}" onclick="routineToggle('${t.id}')" aria-label="${done[t.id]?'Desmarcar':'Concluir'}">${done[t.id]?ic('check',19):''}</button><span class="routine-time">${e(t.time||'')}</span><div style="flex:1;min-width:0"><div class="routine-name">${e(t.title)}</div><div class="routine-meta">${e(t.category)} · ${e(repeatLabel[t.repeat]||'Todos os dias')}</div></div><button class="routine-delete" onclick="routineDelete('${t.id}')" aria-label="Excluir">✕</button></div>`).join(''):`<div class="routine-empty">${ic('clock',30)}<p><b>Nenhuma atividade neste dia.</b></p><p class="m">Adicione tarefas abaixo para montar sua rotina.</p></div>`}
 </div>
 <div class="c"><h2>Adicionar atividade</h2><p class="m">Crie tarefas com horário e escolha em quais dias elas aparecem.</p>
 <div class="routine-form"><div class="wide"><label for="routineTitle">O que você precisa fazer?</label><input id="routineTitle" maxlength="80" placeholder="Ex.: estudar, caminhar, ler..."></div>
 <div><label for="routineCategory">Categoria</label><select id="routineCategory"><option>Pessoal</option><option>Estudos</option><option>Trabalho</option><option>Treino</option><option>Alimentação</option><option>Descanso</option><option>Outro</option></select></div>
 <div><label for="routineTime">Horário</label><input id="routineTime" type="time" value="09:00"></div>
 <div class="wide"><label for="routineRepeat">Repetir</label><select id="routineRepeat"><option value="daily">Todos os dias</option><option value="weekdays">Dias úteis (seg. a sex.)</option><option value="weekend">Fim de semana</option><option value="once">Somente neste dia</option></select></div>
 <button class="pri wide" onclick="routineAdd()">＋ Adicionar à rotina</button></div></div>
 <div class="c"><h3>Como funciona</h3><p class="m">Marque cada atividade quando concluir. Seu progresso fica salvo neste aparelho e é separado por dia. Você pode voltar às datas anteriores para consultar o que fez.</p></div>`;
}
