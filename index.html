<style>
:root,:root[data-theme="dark"]{--bg:#07070c;--s:rgba(255,255,255,.055);--bd:rgba(255,255,255,.09);--tx:#f2f2f7;--mut:#9a9ab0;--a:#8b5cf6;--b:#ec4899;--ok:#34d399;--g:linear-gradient(135deg,#8b5cf6,#ec4899);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Sora,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:96px;overflow-x:hidden}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.g1{background:#8b5cf6;top:-90px;left:-100px}.g2{background:#ec4899;bottom:60px;right:-120px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,70px) scale(1.2)}}
main{max-width:560px;margin:0 auto;padding:14px}
.c{background:var(--s);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px);animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.c:nth-child(2){animation-delay:.07s}.c:nth-child(3){animation-delay:.14s}.c:nth-child(4){animation-delay:.21s}.c:nth-child(5){animation-delay:.28s}.c:nth-child(n+6){animation-delay:.35s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
h1{font-size:26px;margin:0 0 8px;font-weight:800}h2{font-size:20px;margin:0 0 8px;font-weight:800}h3{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.m{color:var(--mut);font-size:12.5px;margin:4px 0}.big{font-size:30px;font-weight:800;margin:2px 0}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.b{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 10px}.b i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
button,.btn,select,input{font:inherit;color:var(--tx);background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;outline:none}
input:focus,select:focus{border-color:var(--a)}
button,.btn{cursor:pointer;transition:transform .15s,box-shadow .2s}button:active,.btn:active{transform:scale(.95)}
.pri{background:var(--g);border:0;font-weight:700;color:#fff;box-shadow:0 8px 24px -8px #8b5cf6}
input{width:100%;box-sizing:border-box;margin:4px 0 10px}label{font-size:12px;color:var(--mut)}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.chip.on{background:var(--g);border:0;font-weight:700}
.ring{position:relative;width:170px;margin:0 auto}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{border-top:1px solid var(--bd);padding:10px 0}.ex .in{display:flex;gap:6px;align-items:center}.ex input{margin:6px 0;width:70px;padding:9px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bd);margin-right:4px}.dot.on{background:var(--ok)}
a{cursor:pointer;color:var(--mut);margin-left:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:rgba(20,20,30,.82);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:26px;padding:6px;z-index:5}
nav button{background:none;border:0;border-radius:20px;padding:8px 10px;font-size:11px;color:var(--mut)}nav button.on{background:var(--g);color:#fff}
.ob{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 30px}
.ob>div{max-width:520px;margin:0 auto;animation:up .5s both}.pg{height:4px;background:var(--bd);border-radius:4px;margin-bottom:26px}.pg i{display:block;height:100%;background:var(--g);transition:width .5s}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--g);padding:10px 18px;border-radius:20px;font-weight:700;z-index:20;animation:tt 2.6s both}
@keyframes tt{0%{opacity:0;top:-20px}12%,85%{opacity:1}100%{opacity:0}}
.fire{display:inline-block;animation:pu 1.4s infinite}@keyframes pu{50%{transform:scale(1.25)}}
.gl{height:90px;width:54px;border:2px solid var(--bd);border-radius:6px 6px 18px 18px;overflow:hidden;position:relative}.gl i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#60a5fa,#3b82f6);transition:height 1s}
.warn{border-color:#f59e0b;color:#fbbf24}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hd b{font-size:19px}.hd button{border-radius:50%;width:44px;height:44px;padding:0;background:var(--g);border:0}
.xp{height:5px;background:var(--bd);border-radius:5px;margin-top:6px;width:150px}.xp i{display:block;height:100%;background:var(--g);border-radius:5px}
.seg{display:flex;gap:8px;margin-bottom:6px}.seg .chip{flex:1;font-size:13px;padding:12px 6px}
.go{display:block;margin:20px auto;width:150px;height:150px;border-radius:50%;font-size:22px;font-weight:800;letter-spacing:.06em;animation:pg 2s infinite}
@keyframes pg{0%{box-shadow:0 0 0 0 rgba(236,72,153,.5)}100%{box-shadow:0 0 0 34px rgba(236,72,153,0)}}
.live{text-align:center}.live .big{font-size:68px;line-height:1.05}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.stat b{display:block;font-size:21px}
.mp{display:block;width:100%;height:180px;background:rgba(255,255,255,.03);border-radius:16px}
.mo{position:fixed;inset:0;z-index:30;background:rgba(5,5,10,.94);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;text-align:center}.mo img{width:min(72vw,290px);border-radius:18px;box-shadow:0 20px 60px -10px #8b5cf6}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd div{text-align:center;padding:10px 4px;border-radius:14px;background:var(--s);font-size:11px;opacity:.35}.bd div.on{opacity:1;background:var(--g)}.bd span{font-size:24px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--mut);font-size:11px}
.dy{padding:0;height:42px;border-radius:12px;position:relative;font-size:13px}.dy i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:11px}
.dy.pd{background:#ec4899;color:#fff;border:0}.dy.pp{border:1px dashed #ec4899}.dy.fw{background:rgba(139,92,246,.28)}.dy.ov{background:#8b5cf6;color:#fff;border:0}.dy.tdy{outline:2px solid var(--tx)}.dy.sel{box-shadow:0 0 0 2px var(--a)}
.cyc{background:linear-gradient(135deg,rgba(236,72,153,.28),rgba(139,92,246,.22))}
.fh{position:fixed;bottom:90px;z-index:40;pointer-events:none;animation:fy 2s ease-out forwards}@keyframes fy{to{transform:translateY(-60vh) rotate(20deg);opacity:0}}
.rt{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:15;background:var(--g);padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px}
.ic{display:inline-block;vertical-align:-3px;flex:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px}
.seg .chip{display:flex;flex-direction:column;align-items:center;gap:6px}
.bd .ic{display:block;margin:0 auto 5px}
.fire{color:#f97316}.fh{color:#ec4899}
.dy i.hrt{color:#ec4899;line-height:0;bottom:4px}.dy.pd i.hrt,.dy.ov i.hrt{color:#fff}
.q{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.q button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.pi{width:72px!important;margin:0!important;padding:8px!important}.stat span.m{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.social-avatar{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--g);font-size:30px;flex:none;overflow:hidden}.social-avatar img{width:100%;height:100%;object-fit:cover}.social-photo-preview{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid #c45bdf}.social-profile-grid button{overflow:hidden}.social-profile-grid button img{width:100%;height:100%;object-fit:cover}
.social-card{border:1px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0;background:rgba(255,255,255,.025)}
.social-row{display:flex;align-items:center;gap:10px}
/* Abas da comunidade: grade responsiva, sem sobreposição no celular */
.social-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0;overflow:visible;width:100%}
.social-tabs button{white-space:normal;overflow-wrap:anywhere;word-break:normal;min-width:0;width:100%;min-height:44px;padding:10px 5px;font-size:clamp(11px,3.2vw,13px);line-height:1.2;text-align:center;display:flex;align-items:center;justify-content:center;border-radius:14px}
@media(max-width:350px){.social-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.social-tabs button{font-size:12px}}
.social-profile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.social-profile-grid button{min-height:64px;font-size:27px;border-radius:18px;padding:8px;display:grid;place-items:center}
.social-profile-grid button.on{outline:2px solid #c45bdf;background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.social-form label{display:block;margin:14px 0 6px;font-size:14px;color:var(--mut)}
.social-form input,.social-form textarea,.social-form select{width:100%;min-width:0;box-sizing:border-box}
.social-form .social-row{align-items:stretch;flex-wrap:wrap}
.social-profile-head{display:flex;align-items:center;gap:14px;padding:8px 0 14px}
.social-profile-head .social-avatar{width:76px;height:76px;font-size:40px}
.social-subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.social-subtabs button{font-size:14px;padding:10px 5px}
.social-rank{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--bd)}
.social-rank:last-child{border-bottom:0}
.social-rank .social-avatar{width:42px;height:42px;font-size:23px}
.social-bottomspace{height:130px}.social-form .photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.social-form input[type=file]{padding:10px;border-radius:12px}
@media(max-width:420px){.social-profile-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.social-subtabs button{font-size:12px;padding:8px 3px}}
</style></head><body>

<script>
const cl=window.claude||{use:async()=>null};
async function dl(n,b){const d=await cl.use('downloads');if(d){await d.save({filename:n,data:b});return}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const $=s=>document.querySelector(s);
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',dumbbell:'<path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/>',pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',fork:'<path d="M7 3v8M4 3v5a3 3 0 006 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',chart:'<path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/>',run:'<circle cx="14" cy="4.5" r="1.8"/><path d="M5 21l3-6 3-1 2 3 2 5M8 15l-2-4 5-3 3 2 3 1"/>',bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8H8M12 13H9"/>',walk:'<circle cx="13" cy="4.5" r="1.8"/><path d="M9 21l2-6-2-3 3-4 3 3 3 1M11 15l4 2 1 4"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',leaf:'<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15"/><path d="M5 19l8-8"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',cloud:'<path d="M7 18a4 4 0 010-8 5 5 0 019.5 1.2A3.5 3.5 0 0116.5 18z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',share:'<path d="M12 15V3M8 7l4-4 4 4M5 12v8h14v-8"/>',thumb:'<path d="M7 11v9H4v-9zM7 11l4-8c2 0 3 1 3 3l-1 4h6a2 2 0 012 2.3l-1 6A2 2 0 0117 20H7"/>',flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',trophy:'<path d="M8 4h8v5a4 4 0 01-8 0zM8 6H4v1a3 3 0 003 3M16 6h4v1a3 3 0 01-3 3M12 13v4M8 21h8M10 17h4"/>',apple:'<path d="M12 7c-4-3-8 0-7 5 1 5 4 9 7 7 3 2 6-2 7-7 1-5-3-8-7-5z"/><path d="M12 7c0-2 1-3 3-4"/>',scale:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9a5 5 0 018 0M12 9l2-2"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>'};
const ic=(n,z,f)=>`<svg class=ic viewBox="0 0 24 24" width=${z||20} height=${z||20} fill=${f?'currentColor':'none'} stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round aria-hidden=true>${IC[n]||''}</svg>`;
let S={p:{},food:[],wk:[],wt:[],lg:[],ses:[],wa:{},cy:{st:[],en:{},hr:{},lg:{}},ms:[],fa:null};
try{const x=localStorage.getItem('dr1');if(x)S=Object.assign(S,JSON.parse(x))}catch(_){}
const save=()=>{try{localStorage.setItem('dr1',JSON.stringify(S))}catch(_){}};
const ld=d=>{d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ago=n=>ld(new Date(Date.now()-n*864e5)),p=()=>S.p;let td=ld();
const AF=[1.2,1.375,1.55,1.725],RK=[.25,.5,.75];
const bmr=()=>10*p().w+6.25*p().h-5*p().age+(p().sex=='m'?5:-161);
const tdee=()=>p().tov||bmr()*AF[p().act];
const adj=()=>p().obj==0?-RK[p().rit]*1100:p().obj==2?[150,300,450][p().rit]:0;
const goal=()=>Math.round(Math.max(tdee()+adj(),bmr(),p().sex=='m'?1500:1200));
const mac=()=>{const pr=1.8*p().w,f=.8*p().w;return{p:pr,f,c:Math.max(0,(goal()-pr*4-f*9)/4)}};
const imc=()=>p().w/Math.pow(p().h/100,2);
const imcC=v=>v<18.5?'abaixo do peso':v<25?'peso normal':v<30?'sobrepeso':'obesidade';
const eat=d=>S.food.filter(x=>x.d==d).reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+(x.c||0),g:a.g+(x.g||0)}),{k:0,p:0,c:0,g:0});
const burn=d=>S.wk.filter(x=>x.d==d).reduce((a,x)=>a+x.k,0);
const score=d=>{const a=eat(d),g=goal(),m=mac();let s=a.k>0?Math.max(0,40-Math.abs(a.k-g)/g*200):0;s+=Math.min(1,a.p/m.p)*30+Math.min(1,(S.wa[d]||0)/(35*p().w))*15+(burn(d)>0?15:0);return Math.round(s)};
const DB=[['Arroz branco cozido',128,2.5,28,.2],['Feijão cozido',76,4.8,14,.5],['Peito de frango grelhado',159,32,0,2.5],['Ovo cozido',146,13,.6,9.5],['Banana',98,1.3,26,.1],['Pão francês',300,8,59,3],['Carne bovina grelhada',220,30,0,10],['Batata-doce cozida',77,.6,18,.1],['Aveia em flocos',394,14,67,8.5],['Leite integral',61,3.2,4.5,3.3],['Maçã',56,.3,15,0],['Iogurte natural',51,4,6,1.5]];
const ACT=[['Caminhada ~5,6 km/h',4.3],['Corrida ~10 km/h',9.8],['Bike leve',4],['Bike moderada',7],['Spinning',9],['Circuito moderado',5],['Aeróbico / HIIT',7.3]];
const PL={3:['Full A','Full B','Full A'],4:['Superior','Inferior','Superior','Inferior'],5:['Push','Pull','Inferior','Superior','Inferior'],6:['Push','Pull','Inferior','Push','Pull','Inferior']};
const EX={'Full A':[['Agachamento livre','Agachamento livre'],['Supino reto','Flexão de braço'],['Remada curvada','Remada com mochila'],['Desenvolvimento com halteres','Pike push-up'],['Prancha','Prancha']],
'Full B':[['Leg press','Afundo'],['Supino inclinado','Flexão fechada'],['Puxada na frente','Remada com elástico'],['Stiff','Ponte de glúteo'],['Elevação lateral','Elevação lateral com garrafas']],
'Superior':[['Supino reto','Flexão de braço'],['Remada curvada','Remada com mochila'],['Desenvolvimento','Pike push-up'],['Puxada na frente','Remada invertida na mesa'],['Rosca direta','Rosca com mochila'],['Tríceps na corda','Mergulho na cadeira']],

'Pull':[['Puxada na frente','Remada invertida na mesa'],['Remada curvada','Remada com mochila'],['Remada baixa','Remada com elástico'],['Face pull','Superman'],['Rosca direta','Rosca com mochila']]};
const plan=()=>PL[p().dias],nextT=()=>plan()[S.ses.length%plan().length],exs=t=>EX[t].map(x=>x[p().loc]),scheme=()=>p().exp?'4×8–12':'3×10–12';

const best=n=>Math.max(0,...S.lg.filter(x=>x.ex==n).map(x=>e1(x.kg,x.r)));

async function socialLoadMessages(){

async function socialSendMessage(other){const u=await currentUser(),content=($('#dmText')?.value||'').trim();if(!content)return;const {error}=await sb.from('direct_messages').insert({sender_id:u.id,recipient_id:other,content});if(error)return toast(error.message);socialLoadMessages();}
